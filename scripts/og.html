<!doctype html>
<!-- The 1200×630 share image, rendered by scripts/make-images.sh. -->
<html lang="en-IE">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../assets/site.css">
<style>
  :root { color-scheme: light; --page: #eff4e8; --ink: #000; --ink-2: #636366; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { display: grid; grid-template-columns: 560px 1fr; align-items: center; padding: 0 56px 0 88px; }
  .brand { gap: 16px; font-size: 40px; }
  .brand img { width: 64px; height: 64px; }
  h1 { margin: 44px 0 0; font: 700 64px/1.05 var(--serif); }
  p { margin: 20px 0 0; font-size: 26px; line-height: 1.35; color: var(--ink-2); }
  .fan-stage { --w: 150px; }
  .fan .cover { animation: none; }
</style>
</head>
<body>
  <div>
    <span class="brand"><img src="../assets/icon.svg" alt="">Pantry</span>
    <h1>The recipe book your household shares.</h1>
    <p>Recipes, the week's plan and one shopping list. For iPhone.</p>
  </div>
  <div class="fan">
    <div class="fan-stage">
      <div class="cover c1"><span>Shakshuka</span></div>
      <div class="cover c3"><span>Chana masala</span></div>
      <div class="cover c2"><span>Leek and potato soup</span></div>
    </div>
  </div>
</body>
</html>
